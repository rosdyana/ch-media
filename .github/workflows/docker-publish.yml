# Builds the ch-media-service image and pushes it to GHCR. The point of this is
# to keep whisper.cpp's from-source compile (several minutes of CPU) off the
# Debian server, which also runs other web services — the server only ever
# runs `docker compose pull`, never `docker compose build`.
name: Build and publish Docker image

on:
  push:
    branches: [main]
    # Skip the build (and the resulting `latest` republish) on changes that
    # can't affect the image — docs, tests, plans.
    paths:
      - Dockerfile
      - package.json
      - package-lock.json
      - src/**
      - scripts/**
      - .github/workflows/docker-publish.yml
  workflow_dispatch:
    inputs:
      no_cache:
        description: >-
          Bypass the build cache. whisper.cpp and yt-dlp are otherwise cached
          layers (see README#requirements), so this is the only way to force
          a fresh whisper.cpp checkout or pick up a newer yt-dlp release
          without waiting for an unrelated Dockerfile/src change.
        type: boolean
        default: false

# Cancel a superseded run rather than let two builds race to push `latest`.
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` for the server's docker-compose.yml default, plus the short
      # commit sha as a stable, pinnable tag for rollback (see README).
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=

      - uses: docker/build-push-action@v6
        with:
          context: .
          # The Debian server is amd64; building arm64 too would just burn CI
          # minutes emulating a platform nothing pulls.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Skip attestation manifests: they add nothing for a private
          # single-arch deploy pulled by an older docker-ce, and are one less
          # thing that could make `docker compose pull` behave unexpectedly.
          provenance: false
          sbom: false
          no-cache: ${{ inputs.no_cache == true }}
          cache-from: ${{ inputs.no_cache == true && '' || 'type=gha' }}
          cache-to: ${{ inputs.no_cache == true && '' || 'type=gha,mode=max' }}
